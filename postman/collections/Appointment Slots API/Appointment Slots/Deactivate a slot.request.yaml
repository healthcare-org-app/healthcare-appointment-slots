$kind: http-request
description: Sets the slot to `inactive` (soft delete).
url: '{{baseUrl}}/api/appointment_slots/:record_id'
method: DELETE
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: Correlation id propagated across HTTP hops. Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
pathVariables:
  - key: record_id
    value: '{{record_id}}'
    disabled: false
    description: (Required) Primary key of the slot record.
settings: {}
order: 6000
scripts:
  - type: afterResponse
    code: |
      pm.test("200 and the deactivated id", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().deactivated).to.be.a("number");
      });
    language: text/javascript
