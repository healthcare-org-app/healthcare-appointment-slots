$kind: http-request
description: Lists slots ordered by `id`. `count` is the total matching the filter, ignoring `limit` and `offset`.
url: '{{baseUrl}}/api/appointment_slots/?limit=10&offset=0'
method: GET
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: Correlation id propagated across HTTP hops. Generated by the service if omitted, and echoed on every response.
  - key: Accept
    value: application/json
queryParams:
  - key: limit
    value: '10'
    disabled: false
    description: Page size.
  - key: offset
    value: '0'
    disabled: false
    description: Rows to skip.
settings: {}
order: 1000
scripts:
  - type: afterResponse
    code: |
      pm.test("200 and a page", () => {
        pm.response.to.have.status(200);
        const p = pm.response.json();
        pm.expect(p).to.have.all.keys("count", "items");
        pm.expect(p.count).to.be.a("number");
        pm.expect(p.items).to.be.an("array");
      });
    language: text/javascript
