$kind: http-request
description: Alias of PATCH.
url: '{{baseUrl}}/api/appointment_slots/:record_id'
method: PUT
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: Correlation id propagated across HTTP hops. Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: record_id
    value: '{{record_id}}'
    disabled: false
    description: (Required) Primary key of the slot record.
body:
  type: json
  content: |-
    {
      "status": "open",
      "location": "Clinic A, Room 4"
    }
settings: {}
order: 5000
scripts:
  - type: afterResponse
    code: |
      function checkSlot(s) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(s).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(s.id).to.be.a("number");
        pm.expect(s.status).to.be.a("string");
      }
      pm.test("200 and the updated slot", () => { pm.response.to.have.status(200); checkSlot(pm.response.json()); });
    language: text/javascript
