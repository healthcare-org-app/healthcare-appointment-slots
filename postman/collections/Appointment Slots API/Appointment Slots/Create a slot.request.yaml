$kind: http-request
description: Creates a slot. The body is stored verbatim as the record's `data` document; an `id` key is discarded.
url: '{{baseUrl}}/api/appointment_slots/'
method: POST
headers:
  - key: X-Request-ID
    value: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187
    disabled: false
    description: Correlation id propagated across HTTP hops. Generated by the service if omitted, and echoed on every response.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "provider_id": 12,
      "starts_at": "2026-08-20T14:30:00+00:00",
      "duration_minutes": 30,
      "location": "Clinic A, Room 3"
    }
settings: {}
order: 500
scripts:
  - type: afterResponse
    code: |
      function checkSlot(s) {
        // Envelope fields are the contract consumers rely on; extra keys are expected.
        pm.expect(s).to.include.all.keys("id", "status", "created_at", "updated_at");
        pm.expect(s.id).to.be.a("number");
        pm.expect(s.status).to.be.a("string");
      }
      pm.test("201 and the slot envelope", () => { pm.response.to.have.status(201); checkSlot(pm.response.json()); });
      // Later requests act on the record created here.
      if (pm.response.code === 201) { pm.collectionVariables.set("record_id", String(pm.response.json().id)); }
    language: text/javascript
